# droidctrl + automator sidecar — example compose.
# Copy to compose.yml and customise for your host.
#
# The automator section here is intentionally minimal. The automator is a
# separate project with its own source, dependencies, and configuration.
# Clone it into ./automator/ and refer to its README for the full list of
# volumes, environment variables, and .env settings required.
#
#   https://github.com/crognlie/droidctrl-automator
#
# Start stream only:         docker compose up -d
# Start stream + automator:  docker compose --profile automator up -d

name: droidctrl
services:
  stream:
    build: .
    container_name: droidctrl
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    privileged: true
    ports:
      - "${PORT:-6080}:6080"
    environment:
      - TZ=${TZ:-UTC}
      - USB_RESET_VID=${USB_RESET_VID:-18d1}
      - REVERSE_TETHER=${REVERSE_TETHER:-false}
      - BIT_RATE=${BIT_RATE:-8M}
      - SCREEN_W=${SCREEN_WIDTH:-0}
      - SCREEN_H=${SCREEN_HEIGHT:-0}
    volumes:
      - /dev/bus/usb:/dev/bus/usb  # Linux only; use ADB_TCP_DEVICE on macOS/Windows
      - ./data:/data
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey:/root/.android/adbkey:ro
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey.pub:/root/.android/adbkey.pub:ro

  # Automator sidecar — requires the automator repo cloned into ./automator/.
  # See https://github.com/crognlie/droidctrl-automator for full setup.
  automator:
    profiles: ["automator"]
    build: ./automator
    container_name: droidctrl-automator
    restart: unless-stopped
    depends_on:
      - stream
    env_file:
      - path: ./automator/.env
        required: false
    environment:
      - ADB_SERVER_SOCKET=tcp:droidctrl:5037
    volumes:
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey:/root/.android/adbkey:ro
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey.pub:/root/.android/adbkey.pub:ro
      # Additional volumes are automator-specific — see the automator repo's README.

networks:
  default:
    name: default_bridge
    external: true
