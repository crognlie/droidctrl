<!DOCTYPE html>
<!--
  Wrapper page served by Caddy at /droidctrl/. Loads noVNC in an iframe and
  adds host-side features that noVNC alone can't provide:
    - clipboard sync (pulls via GET /droidctrl/clipboard every 2s and pushes
      into the iframe's hidden noVNC clipboard text area)
    - wheel-to-swipe (intercepts scroll inside the iframe and forwards it
      to /droidctrl/swipe on the host, so mouse wheel scrolls the phone)
  Both endpoints are reverse-proxied by Caddy to droidctrl:6081.
-->
<html style="margin:0;padding:0;overflow:hidden">
<head>
  <title>Android</title>
  <link rel="icon" type="image/png" sizes="32x32"   href="/droidctrl/app/images/icons/novnc-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/droidctrl/app/images/icons/novnc-192x192.png">
</head>
<body style="margin:0;padding:0;overflow:hidden">
  <iframe
    id="vnc"
    src="/droidctrl/vnc.html?autoconnect=true&resize=scale&path=droidctrl/websockify"
    allow="clipboard-read clipboard-write"
    style="border:none;width:100%;height:100vh"></iframe>

  <script>
  (function () {
    // ---------- clipboard sync (host → phone) ----------
    let last = '';
    let pending = null;

    async function poll() {
      try {
        const r = await fetch('/droidctrl/clipboard');
        if (!r.ok) return;
        const t = await r.text();
        if (t === last) return;
        last = t;
        pending = t;
        const f = document.getElementById('vnc');
        if (f && f.contentDocument) {
          const ta = f.contentDocument.getElementById('noVNC_clipboard_text');
          if (ta) ta.value = t;
        }
      } catch (e) { /* transient network error; retry next tick */ }
    }
    setInterval(poll, 2000);

    // After any user gesture in the iframe, try to push the latest pulled
    // clipboard value into the host clipboard (requires a user gesture for
    // the browser to grant clipboard-write permission).
    function writeClip() {
      if (pending !== null && navigator.clipboard) {
        const p = pending;
        navigator.clipboard.writeText(p)
          .then(() => { if (pending === p) pending = null; })
          .catch(() => { /* permission not granted this gesture — retry next */ });
      }
    }

    // ---------- wheel-to-swipe ----------
    let sa = 0;      // accumulated deltaY pending a swipe
    let sip = false; // swipe in progress (recursive fs() loop)
    let lx = 540, ly = 1200;  // last known pointer location in phone coords

    const frame = document.getElementById('vnc');

    function atk() {
      const d = frame.contentDocument;
      if (!d || !d.getElementById('noVNC_clipboard_text')) {
        return setTimeout(atk, 300);
      }

      d.addEventListener('wheel', function (e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        const cv = d.querySelector('canvas');
        if (cv) {
          const r = cv.getBoundingClientRect();
          if (r.width > 0 && r.height > 0) {
            lx = Math.round((e.clientX - r.left) / r.width  * 1080);
            ly = Math.round((e.clientY - r.top)  / r.height * 2400);
          }
        }
        sa += e.deltaY;
        if (!sip) fs();
      }, { passive: false, capture: true });

      ['click', 'keydown', 'mousedown', 'pointerdown'].forEach(ev => {
        d.addEventListener(ev, writeClip, { capture: true, passive: true });
      });
    }
    frame.addEventListener('load', atk);
    setTimeout(atk, 200);

    async function fs() {
      if (sa === 0) { sip = false; return; }
      sip = true;
      const dy = sa;
      sa = 0;
      const dir = dy > 0 ? 'up' : 'down';
      const amount = Math.min(Math.abs(dy) * 3, 1200);
      try {
        await fetch('/droidctrl/swipe?dir=' + dir + '&amount=' + amount + '&x=' + lx + '&y=' + ly);
      } catch (e) { /* swallow — UI remains responsive */ }
      fs();
    }
  })();
  </script>
</body>
</html>
