<!DOCTYPE html>
<!--
  Native H.264 player for the no-display stack. Served at /droidctrl/ by the
  aiohttp stream server (port 6080) when compose.nodisplay.yml is active.
  The browser decodes H.264 via the WebCodecs API — no VNC pipeline.
-->
<html style="margin:0;padding:0;overflow:hidden">
<head>
  <meta charset="utf-8">
  <title>Android</title>
  <link rel="icon" type="image/png" sizes="32x32"   href="/droidctrl/icons/droidctrl-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/droidctrl/icons/droidctrl-192x192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #status {
      flex-shrink: 0; position: relative;
      display: flex; align-items: center; justify-content: space-between;
      color: #aaa; font: 11px/1.6 monospace;
      background: #111; padding: 2px 8px; gap: 12px;
    }
    #version { position: absolute; left: 50%; transform: translateX(-50%); color: #444; pointer-events: none; }
    #stattext { flex: 1; white-space: nowrap; overflow: hidden; }
    #bwctl, #resctl { white-space: nowrap; flex-shrink: 0; }
    #auto-label { color: #7a7; font-size: 10px; }
    #bwctl select, #resctl select {
      background: #222; color: #ccc; border: 1px solid #444;
      font: inherit; padding: 1px 2px; cursor: pointer; border-radius: 2px;
    }
    #viewport {
      flex: 1; min-height: 0;
      display: flex; flex-direction: row;
      overflow: hidden;
    }
    #canvas-area  { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas        { cursor: crosshair; }
    #right-margin { flex-shrink: 0; width: 64px; display: flex; justify-content: center; align-items: center; }
    #sidebar {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
    }
    .nav-btn {
      width: 44px; height: 44px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px; color: #ccc; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: background .15s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.18); }
    .nav-btn.toggle-on {
      background: rgba(80,200,100,.2); border-color: rgba(80,200,100,.5); color: #7ded90;
    }
    .nav-btn.toggle-on:hover { background: rgba(80,200,100,.3); }
    #sidebar hr { width: 28px; border: none; border-top: 1px solid rgba(255,255,255,.15); margin: 4px 0; }
    /* Toggle modal */
    #toggle-modal {
      display: none; position: fixed; inset: 0; z-index: 200;
      align-items: center; justify-content: center;
      pointer-events: all;
    }
    #toggle-modal.open { display: flex; }
    #toggle-modal-bg {
      position: absolute; inset: 0; background: rgba(0,0,0,.25);
    }
    #toggle-modal-card {
      position: relative; z-index: 1;
      background: rgba(18,20,28,.92); border: 1px solid rgba(255,255,255,.18);
      border-radius: 20px; padding: 28px 32px;
      width: min(680px, 96vw); max-height: 90vh; overflow-y: auto;
      backdrop-filter: blur(12px);
    }
    #toggle-modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; color: #ccc; font: bold 22px/1 monospace;
    }
    #modal-close {
      background: none; border: none; color: #888; cursor: pointer;
      font-size: 32px; padding: 0 0 0 24px; line-height: 1;
    }
    #modal-close:hover { color: #fff; }
    .modal-row {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .modal-row:last-child { border-bottom: none; }
    .modal-label { flex: 1; color: #ccc; font: 20px/1.4 monospace; }
    .modal-btn {
      padding: 16px 28px; border-radius: 10px; cursor: pointer;
      font: 18px monospace; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05); color: #666; min-width: 80px;
    }
    .modal-btn.is-on  { background: rgba(80,200,100,.22); border-color: rgba(80,200,100,.5); color: #7ded90; }
    .modal-btn.is-off { background: rgba(200,80,80,.18);  border-color: rgba(200,80,80,.4);  color: #ed8888; }
    .modal-value-input {
      width: 90px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px; color: #ccc; font: 20px monospace; padding: 14px 10px;
      text-align: center;
    }
    .modal-value-input:focus { outline: none; border-color: rgba(100,160,255,.6); }
    .modal-btn-full { display: block; width: 100%; text-align: center; }
    .modal-numeric-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .modal-step-btn {
      padding: 16px 14px; border-radius: 8px; cursor: pointer;
      font: 20px monospace; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.05); color: #888; line-height: 1;
    }
    .modal-step-btn:hover { background: rgba(255,255,255,.15); color: #ccc; }
    .nav-btn svg { width: 22px; height: 22px; }
    .nav-btn::after {
      content: attr(data-tip);
      position: absolute; right: calc(100% + 8px); top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,.85); color: #fff;
      font: 11px/1.4 monospace; padding: 3px 7px; border-radius: 4px;
      white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity .15s;
    }
    .nav-btn:hover::after { opacity: 1; }
  </style>
</head>
<body>
  <div id="status">
    <span id="stattext">connecting…</span>
    <span id="version">v5</span>
    <span id="cursorinfo"></span>
    <span id="streaminfo"></span>
    <span id="bwctl">bitrate <select id="bitsel">
      <option value="auto">Auto</option>
      <option value="2000000">2 Mb/s</option>
      <option value="4000000">4 Mb/s</option>
      <option value="8000000" selected>8 Mb/s</option>
      <option value="16000000">16 Mb/s</option>
    </select> <span id="auto-label"></span></span>
    <span id="resctl">res <select id="ressel">
      <option value="full">Full</option>
      <option value="half">½</option>
      <option value="quarter">¼</option>
    </select></span>
  </div>
  <div id="viewport">
    <div id="canvas-area">
      <canvas id="c"></canvas>
    </div>
    <div id="right-margin">
      <nav id="sidebar">
        <button class="nav-btn" data-kc="3" data-tip="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
          </svg>
        </button>
        <button class="nav-btn" data-kc="187" data-tip="Recent apps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
          </svg>
        </button>
        <hr>
        <button class="nav-btn" id="gear-btn" data-tip="Manage toggles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </nav>
    </div>
  </div>
  <div id="toggle-modal">
    <div id="toggle-modal-bg"></div>
    <div id="toggle-modal-card">
      <div id="toggle-modal-header">
        <span>Toggles</span>
        <button id="modal-close">✕</button>
      </div>
      <div id="toggle-modal-list"></div>
    </div>
  </div>
  <script>
'use strict';

const canvas    = document.getElementById('c');
const ctx       = canvas.getContext('2d');
const canvasArea = document.getElementById('canvas-area');

function fitCanvas() {
  if (!canvas.width || !canvas.height) return;
  const scale = Math.min(canvasArea.clientWidth / canvas.width, canvasArea.clientHeight / canvas.height);
  canvas.style.width  = Math.round(canvas.width  * scale) + 'px';
  canvas.style.height = Math.round(canvas.height * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
const status   = document.getElementById('status');    // kept for any remaining refs
const stattext = document.getElementById('stattext');
const bitsel      = document.getElementById('bitsel');
const ressel      = document.getElementById('ressel');
const autoLabel   = document.getElementById('auto-label');
const streaminfo  = document.getElementById('streaminfo');
const cursorinfo  = document.getElementById('cursorinfo');

// ---------------------------------------------------------------------------
// Auto bitrate
// ---------------------------------------------------------------------------
const AUTO_MAX_BPS  = 8_000_000;
const AUTO_MIN_BPS  = 2_000_000;  // hardware encoder floor ~2–3 Mb/s regardless of target
const DOWN_FACTOR   = 3 / 4;
const UP_FACTOR     = 4 / 3;
const STABLE_NEEDED = 60_000;  // ms stable before stepping up

const RES_OPTIONS = [
  {value: 'full',    divisor: 1},
  {value: 'half',    divisor: 2},
  {value: 'quarter', divisor: 4},
];

let autoMode      = false;
let autoBps       = AUTO_MAX_BPS;
let autoStableMs  = 0;
let autoTimer     = null;

function parseBps(val) {
  const v = String(val).trim().toUpperCase();
  if (v.endsWith('M')) return parseFloat(v) * 1_000_000;
  if (v.endsWith('K')) return parseFloat(v) * 1_000;
  return parseFloat(v) || AUTO_MAX_BPS;
}

function fmtBps(bps) {
  return bps >= 1_000_000 ? `${(bps/1_000_000).toFixed(1)} Mb/s`
                           : `${(bps/1_000).toFixed(0)} kb/s`;
}

function startAuto(initialBps) {
  autoBps      = Math.min(AUTO_MAX_BPS, Math.max(AUTO_MIN_BPS, initialBps));
  autoStableMs = 0;
  autoMode       = true;
  clearInterval(autoTimer);
  autoTimer = setInterval(autoTick, 10_000);
  updateAutoLabel();
}

function stopAuto() {
  autoMode = false;
  clearInterval(autoTimer);
  autoTimer = null;
  autoLabel.textContent = '';
}

function updateAutoLabel() {
  autoLabel.textContent = autoMode ? fmtBps(autoBps) : '';
}

function autoTick() {
  if (!decoder || decoder.state !== 'configured') return;
  const jitter = calcJitter();
  const queue  = decoder.decodeQueueSize ?? 0;
  if (jitter === null) return;

  if (jitter > 30 || queue > 2) {
    autoBps = Math.max(AUTO_MIN_BPS, autoBps * DOWN_FACTOR);
    autoStableMs = 0;
    applyAutoBps();
  } else if (jitter < 8 && queue === 0) {
    autoStableMs += 10_000;
    if (autoStableMs >= STABLE_NEEDED && autoBps < AUTO_MAX_BPS) {
      autoBps = Math.min(AUTO_MAX_BPS, autoBps * UP_FACTOR);
      autoStableMs = 0;
      applyAutoBps();
    }
  } else {
    autoStableMs = 0;
  }
  updateAutoLabel();
}

function applyAutoBps() {
  fetch(`/droidctrl/bitrate?value=${Math.round(autoBps)}`).catch(() => {});
  updateAutoLabel();
}


bitsel.addEventListener('change', () => {
  if (bitsel.value === 'auto') {
    startAuto(parseBps(bitsel.dataset.lastManual || String(AUTO_MAX_BPS)));
  } else {
    bitsel.dataset.lastManual = bitsel.value;
    stopAuto();
    fetch(`/droidctrl/bitrate?value=${bitsel.value}`).catch(() => {});
  }
});

ressel.addEventListener('change', () => {
  fetch(`/droidctrl/resolution?value=${ressel.value}`).catch(() => {});
});
const toggleModal    = document.getElementById('toggle-modal');
const modalList      = document.getElementById('toggle-modal-list');

// Gear button → open modal
document.getElementById('gear-btn').addEventListener('click', openToggleModal);
document.getElementById('toggle-modal-bg').addEventListener('click', closeToggleModal);
document.getElementById('modal-close').addEventListener('click', closeToggleModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeToggleModal(); });

async function openToggleModal() {
  toggleModal.classList.add('open');
  await refreshModal();
}
function closeToggleModal() {
  toggleModal.classList.remove('open');
}

async function refreshModal() {
  const r = await fetch('/droidctrl/item/list').catch(() => null);
  renderModal(r?.ok ? await r.json() : []);
}

function renderModal(itemList) {
  modalList.innerHTML = '';
  if (!itemList.length) {
    modalList.innerHTML = '<div style="color:#555;font:11px monospace;padding:6px 0">Nothing registered yet.</div>';
    return;
  }
  for (const item of itemList) {
    const row = document.createElement('div');
    row.className = 'modal-row';
    row.dataset.modalItemId = item.id;
    const label = document.createElement('span');
    label.className = 'modal-label'; label.textContent = item.desc;

    if (item.type === 'button') {
      label.className = 'modal-btn modal-btn-full' + (item.state ? ' is-on' : '');
      label.style.cursor = 'pointer';
      label.addEventListener('click', () => clickItemFromModal(item.id, row));
      row.append(label);
    } else if (item.type === 'toggle') {
      const onBtn = document.createElement('button');
      const offBtn = document.createElement('button');
      onBtn.className  = 'modal-btn' + (item.state  ? ' is-on'  : '');
      offBtn.className = 'modal-btn' + (!item.state ? ' is-off' : '');
      onBtn.textContent = 'ON'; offBtn.textContent = 'OFF';
      onBtn.addEventListener('click',  () => setItemFromModal(item.id, true,  row));
      offBtn.addEventListener('click', () => setItemFromModal(item.id, false, row));
      row.append(label, onBtn, offBtn);
    } else {  // numeric
      const group = document.createElement('div');
      group.className = 'modal-numeric-group';
      const input = document.createElement('input');
      input.type = 'number'; input.className = 'modal-value-input';
      input.value = item.state;
      const commit = () => {
        const n = parseFloat(input.value);
        if (!isNaN(n))
          fetch(`/droidctrl/item/set?id=${encodeURIComponent(item.id)}&state=${n}`).catch(() => {});
      };
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { commit(); input.blur(); } });
      const step = (delta) => {
        input.value = (parseFloat(input.value) || 0) + delta;
        commit();
      };
      const minusBtn = document.createElement('button');
      minusBtn.className = 'modal-step-btn'; minusBtn.textContent = '−';
      minusBtn.addEventListener('click', () => step(-10));
      const plusBtn = document.createElement('button');
      plusBtn.className = 'modal-step-btn'; plusBtn.textContent = '+';
      plusBtn.addEventListener('click', () => step(10));
      group.append(minusBtn, input, plusBtn);
      row.append(label, group);
    }
    modalList.appendChild(row);
  }
}

async function clickItemFromModal(id, row) {
  const r = await fetch(`/droidctrl/item/click?id=${encodeURIComponent(id)}`).catch(() => null);
  if (r?.ok) { const d = await r.json(); updateModalRow(row, d.state); }
}

async function setItemFromModal(id, state, row) {
  await fetch(`/droidctrl/item/set?id=${encodeURIComponent(id)}&state=${state}`).catch(() => {});
  updateModalRow(row, state);
}

function updateModalRow(row, state) {
  const fullBtn = row.querySelector('.modal-btn-full');
  if (fullBtn) {
    fullBtn.className = 'modal-btn modal-btn-full' + (state ? ' is-on' : '');
    return;
  }
  const [onBtn, offBtn] = row.querySelectorAll('.modal-btn');
  if (onBtn)  onBtn.className  = 'modal-btn' + (state  ? ' is-on'  : '');
  if (offBtn) offBtn.className = 'modal-btn' + (!state ? ' is-off' : '');
}

const sidebar = document.getElementById('sidebar');

function applyItemStates(states) {
  for (const [id, val] of Object.entries(states)) {
    const row = modalList.querySelector(`[data-modal-item-id="${CSS.escape(id)}"]`);
    if (!row) continue;
    const input = row.querySelector('input[type="number"]');
    if (input) { if (document.activeElement !== input) input.value = val; }
    else updateModalRow(row, !!val);
  }
}

// Poll item states every 2s so automator-driven changes propagate.
setInterval(async () => {
  const r = await fetch('/droidctrl/item/states').catch(() => null);
  if (r?.ok) applyItemStates(await r.json());
}, 2000);

// Built-in nav buttons (keyevent via server)
sidebar.addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  if (btn.dataset.kc) {
    fetch(`/droidctrl/keyevent?code=${btn.dataset.kc}`).catch(() => {});
  }
});

// Toggles are managed via the gear modal only. Register them server-side via
// Register items server-side via GET /item/register — they appear in the gear modal.
// Sync dropdowns to server state on load.
fetch('/droidctrl/settings').then(r => r.json()).then(s => {
  if (s.res_divisor) {
    const opt = RES_OPTIONS.find(r => r.divisor === s.res_divisor);
    if (opt) ressel.value = opt.value;
  }
  if (s.bitrate) {
    const bps = parseBps(s.bitrate);
    const menuOpt = [...bitsel.options].find(o => o.value !== 'auto' && Math.abs(parseBps(o.value) - bps) < 1);
    if (menuOpt) {
      bitsel.value = menuOpt.value;
      bitsel.dataset.lastManual = menuOpt.value;
    } else {
      bitsel.value = 'auto';
      startAuto(bps);
    }
  }
}).catch(() => {});

// ---------------------------------------------------------------------------
// NAL unit helpers (H.264 Annex B)
// ---------------------------------------------------------------------------

function stripStartCode(nal) {
  if (nal.length >= 4 && nal[0] === 0 && nal[1] === 0 && nal[2] === 0 && nal[3] === 1) return nal.subarray(4);
  if (nal.length >= 3 && nal[0] === 0 && nal[1] === 0 && nal[2] === 1) return nal.subarray(3);
  return nal;
}

function nalType(raw) { return raw[0] & 0x1f; }

function buildAvcC(sps, pps) {
  const out = new Uint8Array(11 + sps.length + pps.length);
  let i = 0;
  out[i++] = 1; out[i++] = sps[1]; out[i++] = sps[2]; out[i++] = sps[3];
  out[i++] = 0xff; out[i++] = 0xe1;
  out[i++] = (sps.length >> 8) & 0xff; out[i++] = sps.length & 0xff;
  out.set(sps, i); i += sps.length;
  out[i++] = 1;
  out[i++] = (pps.length >> 8) & 0xff; out[i++] = pps.length & 0xff;
  out.set(pps, i);
  return out;
}

function toAvcc(raw) {
  const out = new Uint8Array(4 + raw.length);
  new DataView(out.buffer).setUint32(0, raw.length, false);
  out.set(raw, 4);
  return out;
}

function codecStr(sps) {
  return 'avc1.' +
    sps[1].toString(16).padStart(2, '0') +
    sps[2].toString(16).padStart(2, '0') +
    sps[3].toString(16).padStart(2, '0');
}

// ---------------------------------------------------------------------------
// Annex-B stream splitter — buffers arbitrary chunks, emits complete NALs
// ---------------------------------------------------------------------------
function makeNalSplitter(onNal) {
  let buf = new Uint8Array(0);

  function findStartCodes(d) {
    const hits = [];
    for (let i = 0; i < d.length - 2; i++) {
      if (d[i] === 0 && d[i+1] === 0) {
        if (d[i+2] === 1)                              { hits.push({pos: i, len: 3}); i += 2; }
        else if (d[i+2] === 0 && i+3 < d.length && d[i+3] === 1) { hits.push({pos: i, len: 4}); i += 3; }
      }
    }
    return hits;
  }

  return function push(chunk) {
    const m = new Uint8Array(buf.length + chunk.length);
    m.set(buf); m.set(chunk, buf.length);
    buf = m;
    const scs = findStartCodes(buf);
    for (let i = 0; i < scs.length - 1; i++) onNal(buf.subarray(scs[i].pos, scs[i+1].pos));
    if (scs.length) buf = buf.slice(scs[scs.length-1].pos);
  };
}

// ---------------------------------------------------------------------------
// Stats (fps + bandwidth, 1-second buckets, 8-second rolling average)
// ---------------------------------------------------------------------------
const STAT_WIN = 8;
let statFpsBuf = [], statBwBuf = [], statTickFps = 0, statTickBw = 0;
let statCodec = '', statW = 0, statH = 0;

// Frame arrival times for jitter calculation (rolling window of 60 frames).
const JITTER_WIN = 60;
let frameTimes = [];

function fmtBw(bytesPerSec) {
  const bps = bytesPerSec * 8;
  return bps >= 1e6
    ? `${(bps / 1e6).toFixed(1)} Mb/s`
    : `${(bps / 1e3).toFixed(0)} kb/s`;
}

function calcJitter() {
  if (frameTimes.length < 3) return null;
  const intervals = [];
  for (let i = 1; i < frameTimes.length; i++)
    intervals.push(frameTimes[i] - frameTimes[i - 1]);
  const mean = intervals.reduce((a, b) => a + b, 0) / intervals.length;
  const variance = intervals.reduce((a, b) => a + (b - mean) ** 2, 0) / intervals.length;
  return Math.sqrt(variance);
}

function tickStats() {
  statFpsBuf.push(statTickFps); statTickFps = 0;
  statBwBuf.push(statTickBw);   statTickBw  = 0;
  if (statFpsBuf.length > STAT_WIN) { statFpsBuf.shift(); statBwBuf.shift(); }

  if (!decoder || decoder.state !== 'configured') return;
  const curFps = statFpsBuf.at(-1);
  const curBw  = statBwBuf.at(-1);
  const avgFps = statFpsBuf.reduce((a, v) => a + v, 0) / statFpsBuf.length;
  const avgBw  = statBwBuf.reduce((a, v) => a + v, 0) / statBwBuf.length;

  const jitter = calcJitter();
  const queue  = decoder.decodeQueueSize ?? 0;
  const jitterStr = jitter !== null ? `  jitter ${jitter.toFixed(0)}ms  buf ${queue}` : '';

  stattext.textContent = `${curFps} fps  ${fmtBw(curBw)} · avg ${avgFps.toFixed(1)} fps  ${fmtBw(avgBw)}${jitterStr}`;
  if (statW) {
    const r  = canvas.getBoundingClientRect();
    const dw = Math.round(r.width), dh = Math.round(r.height);
    const disp = (dw && dw !== statW) ? ` → ${dw}×${dh}` : '';
    streaminfo.textContent = `${statW}×${statH}${disp} · ${statCodec}`;
  }
}
setInterval(tickStats, 1000);

// ---------------------------------------------------------------------------
// VideoDecoder
// ---------------------------------------------------------------------------
let decoder = null, spsRaw = null, ppsRaw = null;

function closeDecoder() {
  if (decoder && decoder.state !== 'closed') decoder.close();
  decoder = null;
}

function openDecoder(sps, pps) {
  closeDecoder();
  const codec = codecStr(sps);
  statCodec = codec;
  streaminfo.textContent = `… · ${codec}`;
  decoder = new VideoDecoder({
    output(frame) {
      const fw = frame.displayWidth, fh = frame.displayHeight;
      if (canvas.width !== fw || canvas.height !== fh) {
        canvas.width = fw; canvas.height = fh;
        fitCanvas();
      }
      ctx.drawImage(frame, 0, 0);
      frame.close();
      statTickFps++;
      statW = fw; statH = fh;
      const now = performance.now();
      frameTimes.push(now);
      if (frameTimes.length > JITTER_WIN) frameTimes.shift();
    },
    error(e) { console.error('[decoder]', e); closeDecoder(); },
  });
  decoder.configure({ codec, description: buildAvcC(sps, pps), optimizeForLatency: true });
}

function handleNal(nal) {
  const raw = stripStartCode(nal);
  if (!raw.length) return;
  const t = nalType(raw);
  if (t === 7) { spsRaw = raw; return; }
  if (t === 8) { ppsRaw = raw; if (spsRaw) openDecoder(spsRaw, ppsRaw); return; }
  if (t === 9 || t === 6 || t === 12) return;
  if (!decoder || decoder.state !== 'configured') return;
  try {
    decoder.decode(new EncodedVideoChunk({
      type: t === 5 ? 'key' : 'delta',
      timestamp: performance.now() * 1000,   // µs; real time → no buffering delay
      data: toAvcc(raw),
    }));
  } catch(e) { console.warn('[decode]', e); }
}

// ---------------------------------------------------------------------------
// WebSocket — auto-reconnect, URL derived from current page path
// ---------------------------------------------------------------------------
// Module-level watchdog so openDecoder's output callback can reset it.
let _watchdog = null;
function resetWatchdog() {
  clearTimeout(_watchdog);
  _watchdog = setTimeout(() => {
    console.warn('[watchdog] no data for 5s, reconnecting');
    if (_activeWs) _activeWs.close();
  }, 5000);
}
let _activeWs = null;

// Reconnect when the tab becomes visible after being backgrounded.
// Mobile browsers freeze pages while hidden; the WebSocket appears OPEN but
// is stale. Two fixes needed:
//   1. Use null (not 0) as sentinel so a slow initial load never triggers.
//   2. If the WS is already CLOSED, call connect() directly — close() on a
//      CLOSED socket is a no-op and won't fire onclose.
let _hiddenAt = null;

function _forceReconnect() {
  if (!_activeWs || _activeWs.readyState === WebSocket.CLOSED) {
    connect();
  } else {
    _activeWs.close();  // triggers onclose → setTimeout(connect, 1000)
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    _hiddenAt = performance.now();
  } else if (_hiddenAt !== null && performance.now() - _hiddenAt > 3000) {
    _hiddenAt = null;
    _forceReconnect();
  }
});
// pageshow with persisted=true = bfcache restore; WebSocket is always stale.
window.addEventListener('pageshow', e => {
  if (e.persisted) _forceReconnect();
});

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/droidctrl/ws`);
  ws.binaryType = 'arraybuffer';
  _activeWs = ws;
  stattext.textContent = 'connecting…';
  const push = makeNalSplitter(handleNal);

  ws.onopen  = () => {
    stattext.textContent = 'connected — waiting for stream…';
    streaminfo.textContent = '';
    spsRaw = null; ppsRaw = null;
    statFpsBuf = []; statBwBuf = []; statTickFps = 0; statTickBw = 0;
    frameTimes = [];
    closeDecoder();
    resetWatchdog();
  };
  ws.onmessage = e => {
    if (typeof e.data !== 'string') resetWatchdog(); // any data = connection alive
    if (typeof e.data === 'string') {
      try {
        const m = JSON.parse(e.data);
        if (m.reload) {
          // sessionStorage cooldown prevents a reload loop when the server sends
          // the signal to every new connection during its 30-second startup window.
          const last = parseInt(sessionStorage.getItem('lastServerReload') || '0');
          if (Date.now() - last > 10000) {
            sessionStorage.setItem('lastServerReload', String(Date.now()));
            location.reload();
          }
          return;
        }
        if (m.settings?.bitrate && !autoMode) {
          const bps = parseBps(m.settings.bitrate);
          const opt = [...bitsel.options].find(o => o.value !== 'auto' && Math.abs(parseBps(o.value) - bps) < 1);
          if (opt) bitsel.value = opt.value;
        }
        if (m.settings?.res_divisor !== undefined && !autoMode) {
          const opt = RES_OPTIONS.find(r => r.divisor === m.settings.res_divisor);
          if (opt) ressel.value = opt.value;
        }
        if (m.item_states) applyItemStates(m.item_states);
        if (m.item_list)   { if (toggleModal.classList.contains('open')) refreshModal(); }
      } catch {}
      return;
    }
    statTickBw += e.data.byteLength;
    push(new Uint8Array(e.data));
  };
  ws.onclose = () => { closeDecoder(); stattext.textContent = 'reconnecting…'; setTimeout(connect, 1000); };
  ws.onerror = e => console.error('[ws]', e);
}

if (!('VideoDecoder' in window)) {
  stattext.textContent = 'WebCodecs not supported — requires Chrome 94+ or Edge 94+';
} else {
  connect();
}

// ---------------------------------------------------------------------------
// Input: tap (click) and scroll (wheel → swipe)
// ---------------------------------------------------------------------------

function phoneCoords(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.round((clientX - r.left) * (canvas.width  / r.width)),
    y: Math.round((clientY - r.top)  * (canvas.height / r.height)),
  };
}

// Cursor position display.
canvas.addEventListener('mousemove', e => {
  const {x, y} = phoneCoords(e.clientX, e.clientY);
  cursorinfo.textContent = `(${x}, ${y})`;
});
canvas.addEventListener('mouseleave', () => {
  cursorinfo.textContent = '';
  downAt = downPhone = null;
});

// Tap, drag, and long-press via mousedown → mouseup gesture collection.
// Long-press: same-origin swipe with actual hold duration — Android's gesture
// detector fires the long-press callback after ~500ms of stationary touch.
let downAt = null, downPhone = null, downTime = null;
canvas.addEventListener('mousedown', e => {
  downAt    = {x: e.clientX, y: e.clientY};
  downPhone = phoneCoords(e.clientX, e.clientY);
  downTime  = performance.now();
});
canvas.addEventListener('mouseup', e => {
  if (!downAt) return;
  const dx = e.clientX - downAt.x, dy = e.clientY - downAt.y;
  const start = downPhone;
  downAt = downPhone = null;
  const elapsed = Math.round(performance.now() - downTime);
  const dist    = Math.hypot(dx, dy);
  if (dist <= 8) {
    if (elapsed < 500) {
      // Quick tap
      const {x, y} = phoneCoords(e.clientX, e.clientY);
      fetch(`/droidctrl/tap?x=${x}&y=${y}`).catch(() => {});
    } else {
      // Long press: zero-movement swipe with actual hold duration
      fetch(`/droidctrl/drag?x1=${start.x}&y1=${start.y}&x2=${start.x}&y2=${start.y}&duration=${elapsed}`).catch(() => {});
    }
  } else {
    // Drag
    const end = phoneCoords(e.clientX, e.clientY);
    const dur = Math.round(Math.max(30, Math.min(elapsed, 600)));
    fetch(`/droidctrl/drag?x1=${start.x}&y1=${start.y}&x2=${end.x}&y2=${end.y}&duration=${dur}`).catch(() => {});
  }
});

// Touch tap (single finger, no drag) — for touchscreen browsers.
let touchStart = null, touchDownTime = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  e.preventDefault(); // prevents browser synthesizing mouse events → stops double-tap
  touchStart = phoneCoords(e.touches[0].clientX, e.touches[0].clientY);
  touchDownTime = performance.now();
}, {passive: false});
canvas.addEventListener('touchend', e => {
  if (!touchStart || e.changedTouches.length !== 1) { touchStart = null; return; }
  e.preventDefault();
  const t = e.changedTouches[0];
  const end = phoneCoords(t.clientX, t.clientY);
  const dx = end.x - touchStart.x, dy = end.y - touchStart.y;
  const start = touchStart;
  touchStart = null;
  if (Math.hypot(dx, dy) <= 30) {
    fetch(`/droidctrl/tap?x=${end.x}&y=${end.y}`).catch(() => {});
  } else {
    const dur = Math.round(Math.max(30, Math.min(performance.now() - touchDownTime, 600)));
    fetch(`/droidctrl/drag?x1=${start.x}&y1=${start.y}&x2=${end.x}&y2=${end.y}&duration=${dur}`).catch(() => {});
  }
}, {passive: false});

// ---------------------------------------------------------------------------
// Keyboard — printable ASCII only
// ---------------------------------------------------------------------------
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.ctrlKey || e.metaKey) return;
  if (e.key.length !== 1) return;
  e.preventDefault();
  fetch(`/droidctrl/key?text=${encodeURIComponent(e.key)}`).catch(() => {});
});

// Wheel → swipe. Debounce: collect events for 80ms then send one swipe.
let wsa = 0, wlx = 540, wly = 1200, wTimer = null;
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) {
    wlx = Math.round((e.clientX - r.left) / r.width  * canvas.width);
    wly = Math.round((e.clientY - r.top)  / r.height * canvas.height);
  }
  wsa += e.deltaY;
  clearTimeout(wTimer);
  wTimer = setTimeout(() => {
    if (wsa === 0) return;
    const dir    = wsa > 0 ? 'up' : 'down';
    const amount = Math.min(Math.abs(wsa) * 3, 1200);
    fetch(`/droidctrl/swipe?dir=${dir}&amount=${amount}&x=${wlx}&y=${wly}`).catch(() => {});
    wsa = 0;
  }, 80);
}, {passive: false});
  </script>
</body>
</html>
