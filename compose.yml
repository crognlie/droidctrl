# Native H.264 → WebCodecs streaming stack.
# Streams Android screen directly to the browser; no Xvfb/x11vnc/noVNC.
#
# Start:  docker compose up -d
# Stop:   docker compose down

name: droidctrl
services:
  scrcpy:
    build: .
    container_name: droidctrl
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    privileged: true
    ports:
      - "${PORT:-6080}:6080"
    environment:
      - TZ=${TZ:-UTC}
      - USB_RESET_VID=${USB_RESET_VID:-18d1}
      - REVERSE_TETHER=${REVERSE_TETHER:-false}
      - BIT_RATE=${BIT_RATE:-8M}
      - SCREEN_W=${SCREEN_WIDTH:-0}
      - SCREEN_H=${SCREEN_HEIGHT:-0}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data:/data
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey:/root/.android/adbkey:ro
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey.pub:/root/.android/adbkey.pub:ro

  # Optional — requires the automator repo cloned into ./automator.
  # Enable with: docker compose --profile automator up
  automator:
    profiles: ["automator"]
    build: ./automator
    container_name: droidctrl-automator
    restart: unless-stopped
    depends_on:
      - scrcpy
    env_file:
      - path: ./automator/.env
        required: false
    environment:
      - ADB_SERVER_SOCKET=tcp:droidctrl:5037
    volumes:
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey:/root/.android/adbkey:ro
      - ${ADB_KEY_DIR:-${HOME}/.android}/adbkey.pub:/root/.android/adbkey.pub:ro
      - ./automator/automator.py:/automator.py:ro
      - ./automator/gem.py:/gem.py:ro
      - ./automator/backup.py:/backup.py:ro
      - ${BACKUP_DIR:-/tmp/automator-backup}:/backup

networks:
  default:
    name: default_bridge
    external: true
